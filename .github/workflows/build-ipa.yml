name: Build IPA from kit

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (9.1.78)"
        required: true
        type: string
      kit_url:
        description: "Direct link to spoti.pw-0.50.0-kit.zip"
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Install tools
        run: |
          brew install ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download
        run: |
          mkdir -p ipa out
          curl -fsSL "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          curl -fsSL "${{ inputs.kit_url }}" -o kit.zip
          unzip -q kit.zip -d kit

      - name: Build
        run: |
          set -euo pipefail
          IN=ipa/spotify.ipa
          OUT="$PWD/out/spoti.ipa"
          APP="$(unzip -Z1 "$IN" | grep -oE '^Payload/[^/]+\.app/' | sort -u | head -1)"
          unzip -p "$IN" "${APP}Info.plist" > host.plist
          echo "Spotify $(plutil -extract CFBundleShortVersionString raw -o - host.plist)"

          A=kit/files/PlugIns/SpotifyGlassLiveActivity.appex
          rm -rf "$A/_CodeSignature"
          sed -e "s/HOST_BUNDLE_ID/$(plutil -extract CFBundleIdentifier raw -o - host.plist)/" \
              -e "s/HOST_SHORT_VERSION/$(plutil -extract CFBundleShortVersionString raw -o - host.plist)/" \
              -e "s/HOST_VERSION/$(plutil -extract CFBundleVersion raw -o - host.plist)/" \
              "$A/Info.plist" > info.tmp
          mv info.tmp "$A/Info.plist"
          plutil -convert binary1 "$A/Info.plist"

          cat > kit.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>UIDesignRequiresCompatibility</key><false/>
          <key>NSSupportsLiveActivities</key><true/>
          <key>NSSupportsLiveActivitiesFrequentUpdates</key><true/>
          <key>MusicHapticsSupported</key><true/>
          </dict>
          </plist>
          EOF

          cyan -i "$IN" -o "$OUT" \
            -f kit/files/Frameworks/spotifyglass.dylib kit/files/Frameworks/SpotifyGlassAppGroups.dylib "$A" \
            -l kit.plist -w -s --overwrite

          W="${APP}PlugIns/WidgetExtension.appex/WidgetExtension"
          if unzip -l "$OUT" "$W" >/dev/null 2>&1; then
            P="$(mktemp -d)"
            unzip -q "$OUT" "$W" -d "$P"
            python3 scripts/insert-dylib.py "$P/$W" @rpath/SpotifyGlassAppGroups.dylib
            ldid -e "$P/$W" > "$P/ents.plist"
            ldid -S"$P/ents.plist" "$P/$W"
            (cd "$P" && zip -q "$OUT" "$W")
          fi

          python3 scripts/merge-appintents.py "$OUT" "$APP" kit/appintents

      - uses: actions/upload-artifact@v5
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error
